<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#3b2a20">
  <title>Sweet Creatures | Staff</title>
  <link rel="manifest" href="assets/staff-manifest.webmanifest">
  <link rel="icon" href="assets/staff-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/staff-icon.svg">
  <link rel="stylesheet" href="staff-style.css">
</head>
<body>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <h1 id="title">Hello</h1>
      <button class="link-btn" data-act="signout">Sign out</button>
    </header>

    <main class="views">
      <section class="view" id="view-home"></section>
      <section class="view" id="view-log" hidden></section>
      <section class="view" id="view-pay" hidden></section>
      <section class="view" id="view-cash" hidden></section>
      <section class="view" id="view-sop" hidden></section>
      <section class="view" id="view-sync" hidden></section>
    </main>

    <nav class="tabs" aria-label="Main">
      <button class="tab" data-tab="home"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.8 9.6V19a1 1 0 0 0 1 1h3.4v-5.2h3.6V20h3.4a1 1 0 0 0 1-1V9.6"/></svg><span class="tab-label">Home</span></button>
      <button class="tab" data-tab="log"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M8.5 14h3M8.5 17h6"/></svg><span class="tab-label">Log</span></button>
      <button class="tab" data-tab="pay"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h9l4 4v13H6z"/><path d="M15 3.5v4h4M9 12h7M9 15.5h7M9 8.5h3"/></svg><span class="tab-label">Payslips</span></button>
      <button class="tab" data-tab="cash"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="3"/><circle cx="12" cy="12" r="2.8"/><path d="M6 9.5v.1M18 14.5v.1"/></svg><span class="tab-label">Advances</span></button>
      <button class="tab" data-tab="sop"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4.5" width="14" height="16" rx="3"/><path d="M9 4.5V3.5h6v1M9 10h6M9 13.5h6M9 17h3.5"/></svg><span class="tab-label">SOP</span></button>
      <button class="tab" data-tab="sync"><svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14-4.5L4 9"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14 4.5L20 15"/><path d="M20 20v-5h-5"/></svg><span class="tab-label">Sync</span><span class="badge" id="sync-badge" hidden>0</span></button>
    </nav>
  </div>

  <!-- ===== Photo capture sheet (Time In / Time Out, FR-03) ===== -->
  <section class="photo-sheet" id="photo" hidden aria-label="Confirm photo">
    <header class="topbar">
      <h1>Confirm photo</h1>
      <button class="link-btn" id="photo-cancel" type="button">Cancel</button>
    </header>
    <div class="photo-stage">
      <video id="cam" playsinline muted autoplay></video>
      <img id="shot" alt="Captured photo preview" hidden>
      <p class="cam-msg" id="cam-msg" hidden></p>
    </div>
    <p class="photo-title" id="photo-title"></p>
    <div class="photo-actions" id="photo-actions"></div>
    <!-- fallback when the browser blocks the live camera -->
    <input id="file" type="file" accept="image/*" capture="user" hidden>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>window.SC_CONFIG = { mode: 'backend' };</script>
  <script src="staff-api.js"></script>
  <script src="staff-app.js"></script>
</body>
</html>
